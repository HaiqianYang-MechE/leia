# LEIA production v2 dynamics recipe — MicroPlate lattice.
#
# Pinned from the paper's saved checkpoint config.
# Trained on 8 × H100; best_ar.pt selected by AR rollout MSE on the last 5 trajectories
# of the first training plate (a stability proxy; they are also in the training windows).

architecture:
  model: adaln                      # AdaLN-conditioned, the production backbone
  # heads / layers / embed_dim / num_latents derived from tokenizer ckpt at runtime
  dropout: 0.3
  velocity_input: true              # state + (state - prev_state) → input projection
  residual: false                   # raw delta prediction is unstable on lattice

data:
  mmap_dir: data/microplate_lattice/structure_tokens_prod_mmap
  exclude_plates: []                # production_plates_v2 manifest controls splits
  # actions: cumulative 4-DOF BC per action step (leia.stress.compute_cumulative_bc)
  action_scale: 1.0

method:
  method: continuous_pf             # pushforward training (latent-space AR closes loop)
  rollout_steps: 10                 # K = 10; fits H100 80 GB with batch 8 × K=512
  noise_std: 0.02                   # Gaussian perturbation on prev-state

optimization:
  batch_size: 8                     # per-GPU; 8 GPU * 8 = 64 effective
  lr: 1.0e-4
  weight_decay: 1.0e-4
  epochs: 300
  warmup_epochs: 10
  lr_schedule: cosine
  bf16: true

eval:
  ar_eval_trajs: 5                  # rollout 5 trajectories every epoch for best_ar.pt
  ar_eval_interval: 1

tokenizer_checkpoint: checkpoints/tokenizer/production_v2/best.pt

logging:
  wandb_project: leia-dynamics
  log_interval: 100
  checkpoint_interval: 1
